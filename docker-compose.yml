# Production / evaluation stack (make). Dev overrides: docker-compose.dev.yml (make dev)

networks:
  main-network:
    driver: bridge

volumes:
  postgres_data:

services:

  matcha_nginx:
    container_name: matcha_nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8443:443"
    stop_grace_period: 2s
    networks:
      - main-network
    restart: on-failure

  matcha_server:
    container_name: matcha_server
    build:
      context: ./matcha
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    volumes:
      # pictures downloaded by the seed, shared with dev
      - ./matcha/.seed-cache:/app/.seed-cache
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - main-network
    depends_on:
      matcha_postgres:
        condition: service_healthy
    restart: on-failure

  matcha_postgres:
    container_name: matcha_postgres
    image: postgres:17-alpine
    expose:
      - "5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d/
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - main-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d matcha -U alice"]
      interval: 1s
      timeout: 1s
      retries: 5
    restart: on-failure

  # no real SMTP: verification / reset emails are read at http://localhost:8025
  mailpit:
    container_name: matcha_mailpit
    image: axllent/mailpit
    ports:
      - "8025:8025"   # Interface web
    networks:
      - main-network
